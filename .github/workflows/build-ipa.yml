name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Xcode 16.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Fix Storyboard Target Devices for CI
        run: |
          find ios -name "SplashScreen.storyboard" -exec sed -i '' 's/<device [^>]*\/>/<device id="retina6_1" orientation="portrait" appearance="light"\/>/g' {} + || true
          echo "Updated SplashScreen.storyboard device compatibility"

      - name: Configure Xcode Node Environment
        run: |
          NODE_PATH=$(which node)
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Patch MMKV for Xcode 16 Compatibility
        run: |
          find ios/Pods -name "AESCrypt.cpp" -exec sed -i '' '1s/^/#include <string.h>\n#define memset_s(dest, destsz, ch, count) memset(dest, ch, count)\n/' {} +
          echo "Patched MMKVCore AESCrypt.cpp successfully"

      - name: Build iOS Release App (Ad-Hoc Signed for Sideloadly)
        run: |
          echo "Starting xcodebuild..."
          xcodebuild -workspace ios/SHEPHERD.xcworkspace \
            -scheme SHEPHERD \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -destination 'generic/platform=iOS' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            build > xcodebuild.log 2>&1 || (echo "=== XCODEBUILD ERROR LOG ===" && grep -C 5 -E "(error:|fatal error:)" xcodebuild.log || tail -n 80 xcodebuild.log && exit 1)
          echo "Build succeeded!"

      - name: Package .app into .ipa for Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" | head -n 1)
          fi
          echo "Found app to package: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r shepherd.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shepherd-ios-ipa
          path: shepherd.ipa
          retention-days: 14
