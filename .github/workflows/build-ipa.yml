name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS Release Archive
        run: |
          xcodebuild -workspace ios/SHEPHERD.xcworkspace \
            -scheme SHEPHERD \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SHEPHERD.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -destination 'generic/platform=iOS' \
            clean archive

      - name: Package .app into .ipa for Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH="build/SHEPHERD.xcarchive/Products/Applications/SHEPHERD.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" | head -n 1)
          fi
          echo "Packaging: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r shepherd.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shepherd-ios-ipa
          path: shepherd.ipa
          retention-days: 14
